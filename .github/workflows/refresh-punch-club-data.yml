name: Refresh Punch Club Data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read Google source metrics
        env:
          STOTT_PRIMARY_GOOGLE_TOKEN_JSON: ${{ secrets.STOTT_PRIMARY_GOOGLE_TOKEN_JSON }}
          SJAWC_GOOGLE_TOKEN_JSON: ${{ secrets.SJAWC_GOOGLE_TOKEN_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_ADS_CONFIG_JSON: ${{ secrets.GOOGLE_ADS_CONFIG_JSON }}
        run: python tools/refresh_punch_google_data.py --start 2026-08-08 --end 2026-09-06
      - uses: actions/upload-artifact@v4
        with:
          name: punch-google-source-check
          path: data/punch-club/google.json
          retention-days: 3
