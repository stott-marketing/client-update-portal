name: Refresh Z4B Data (Last30 vs Prev30 + dropdown windows)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *" # 6am ET daily (offset from SJAWC)

permissions:
  contents: write

concurrency:
  group: refresh-z4b-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install openpyxl
      - name: Prepare creds
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          SEARCH_ATLAS_API_KEY: ${{ secrets.SEARCH_ATLAS_API_KEY }}
          Z4B_SHOPIFY_SHOP: ${{ secrets.Z4B_SHOPIFY_SHOP }}
          Z4B_SHOPIFY_ACCESS_TOKEN: ${{ secrets.Z4B_SHOPIFY_ACCESS_TOKEN }}
        run: |
          mkdir -p /tmp
          echo "$GOOGLE_TOKEN_JSON" > /tmp/google_token.json
          echo "$GOOGLE_OAUTH_CLIENT_JSON" > /tmp/google_oauth_client.json
          echo "$SEARCH_ATLAS_API_KEY" > /tmp/search_atlas_key.txt
      - name: Refresh Z4B
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          SEARCH_ATLAS_API_KEY: ${{ secrets.SEARCH_ATLAS_API_KEY }}
          Z4B_SHOPIFY_SHOP: ${{ secrets.Z4B_SHOPIFY_SHOP }}
          Z4B_SHOPIFY_ACCESS_TOKEN: ${{ secrets.Z4B_SHOPIFY_ACCESS_TOKEN }}
        run: python tools/refresh_z4b_data.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/z4b/ firebase-static/public/zincs-for-boats/data/live.json client-update-portal/public/zincs-for-boats/data/live.json || true
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Refresh Z4B live.json last30 vs prev30 + lastMonth/lastQuarter/YTD"; git push; fi
