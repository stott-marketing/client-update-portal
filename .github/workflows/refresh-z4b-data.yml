name: Refresh Z4B Data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 10 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-z4b-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh cached Z4B data
        env:
          Z4B_SHOPIFY_SHOP: ${{ secrets.Z4B_SHOPIFY_SHOP }}
          Z4B_SHOPIFY_ACCESS_TOKEN: ${{ secrets.Z4B_SHOPIFY_ACCESS_TOKEN }}
        run: python tools/refresh_z4b_data.py

      - name: Build static portal
        run: python tools/build_firebase_static.py

      - name: Commit refreshed report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/z4b/*.json firebase-static/public/zincs-for-boats/index.html firebase-static/firebase.json
          if git diff --cached --quiet; then
            echo "No Z4B report changes to commit."
          else
            git commit -m "Refresh Z4B cached report data"
            git push
          fi
