name: Refresh Airocide Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *" # 5am ET daily (9am UTC) - Apr1->Today live cards

permissions:
  contents: write

concurrency:
  group: refresh-airocide-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install openpyxl

      - name: Prepare Google creds from secrets
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          SEARCH_ATLAS_API_KEY: ${{ secrets.SEARCH_ATLAS_API_KEY }}
          STOTT_PRIMARY_GOOGLE_TOKEN_JSON: ${{ secrets.STOTT_PRIMARY_GOOGLE_TOKEN_JSON }}
        run: |
          mkdir -p /tmp
          printf '%s' "$GOOGLE_TOKEN_JSON" > /tmp/google_token.json
          printf '%s' "$GOOGLE_OAUTH_CLIENT_JSON" > /tmp/google_oauth_client.json
          printf '%s' "$SEARCH_ATLAS_API_KEY" > /tmp/search_atlas_key.txt
          # also prepare stott-primary token if you use specific secret
          if [ -n "$STOTT_PRIMARY_GOOGLE_TOKEN_JSON" ]; then
            printf '%s' "$STOTT_PRIMARY_GOOGLE_TOKEN_JSON" > /tmp/google_token.json
          fi

      - name: Refresh cached Airocide data (Apr1->Today + MoM + live.json)
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          SEARCH_ATLAS_API_KEY: ${{ secrets.SEARCH_ATLAS_API_KEY }}
          STOTT_PRIMARY_GOOGLE_TOKEN_JSON: ${{ secrets.STOTT_PRIMARY_GOOGLE_TOKEN_JSON }}
        run: python tools/refresh_airocide_data.py

      - name: Build Airocide report
        run: python tools/build_airocide_report.py || echo "build script optional"

      - name: Commit refreshed Airocide data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in \
            data/airocide/ga4.json \
            data/airocide/ga4_prev.json \
            data/airocide/ga4_prev30.json \
            data/airocide/ga4_last30.json \
            data/airocide/ga4_ytd.json \
            data/airocide/ga4_channels.json \
            data/airocide/ga4_hostname.json \
            data/airocide/ga4_additional.json \
            data/airocide/ga4_additional_prev.json \
            data/airocide/search_console.json \
            data/airocide/search_atlas.json \
            data/airocide/refresh_summary.json \
            data/airocide/live.json \
            firebase-static/public/airocide-systems/data/live.json \
            client-update-portal/public/airocide-systems/data/live.json \
            firebase-static/public/airocide-systems/index.html
          do
            if [ -e "$path" ]; then
              git add -f "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No Airocide report changes to commit."
          else
            git commit -m "Refresh Airocide data Apr1->Today + MoM + live.json"
            git push
          fi
