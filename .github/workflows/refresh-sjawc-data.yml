name: Refresh SJAWC Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-sjawc-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare credentials from secrets
        env:
          SJAWC_GOOGLE_TOKEN_JSON: ${{ secrets.SJAWC_GOOGLE_TOKEN_JSON }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_ADS_CONFIG_JSON: ${{ secrets.GOOGLE_ADS_CONFIG_JSON }}
          SJAWC_META_TOKEN: ${{ secrets.SJAWC_META_TOKEN }}
          SJAWC_GHL_TOKEN: ${{ secrets.SJAWC_GHL_TOKEN }}
          SEARCH_ATLAS_API_KEY: ${{ secrets.SEARCH_ATLAS_API_KEY }}
        run: |
          mkdir -p ~/.config/stott-marketing/google-data/tokens
          mkdir -p ~/.config/stott-marketing/meta-data/tokens
          mkdir -p ~/.config/stott-marketing/ghl-data/tokens
          mkdir -p ~/.config/stott-marketing/search-atlas/tokens
          printf '%s' "$SJAWC_GOOGLE_TOKEN_JSON" > ~/.config/stott-marketing/google-data/tokens/sjawc-michaelrstott.json
          printf '%s' "$SJAWC_META_TOKEN" > ~/.config/stott-marketing/meta-data/tokens/michaelrstott.txt
          printf '%s' "$SJAWC_GHL_TOKEN" > ~/.config/stott-marketing/ghl-data/tokens/sjawc.txt
          printf '%s' "$SEARCH_ATLAS_API_KEY" > ~/.config/stott-marketing/search-atlas/tokens/search-atlas-key.txt

      - name: Refresh cached SJAWC data
        env:
          SJAWC_GOOGLE_TOKEN_JSON: ${{ secrets.SJAWC_GOOGLE_TOKEN_JSON }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_ADS_CONFIG_JSON: ${{ secrets.GOOGLE_ADS_CONFIG_JSON }}
          SJAWC_META_TOKEN: ${{ secrets.SJAWC_META_TOKEN }}
          SJAWC_GHL_TOKEN: ${{ secrets.SJAWC_GHL_TOKEN }}
          SEARCH_ATLAS_API_KEY: ${{ secrets.SEARCH_ATLAS_API_KEY }}
        run: python tools/refresh_sjawc_data.py

      - name: Build SJAWC report
        run: python tools/build_sjawc_meeting_report.py

      - name: Commit refreshed SJAWC report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/sjawc/ firebase-static/public/st-johns-aesthetics/
          if git diff --cached --quiet; then
            echo "No SJAWC report changes to commit."
          else
            git commit -m "Refresh SJAWC report data"
            git push
          fi
