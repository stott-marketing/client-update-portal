name: Refresh SJAWC Data

on:
  workflow_dispatch:
  schedule:
    - cron: "50 10 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-sjawc-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install openpyxl

      - name: Refresh cached SJAWC data
        env:
          SJAWC_GOOGLE_TOKEN_JSON: ${{ secrets.SJAWC_GOOGLE_TOKEN_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_ADS_CONFIG_JSON: ${{ secrets.GOOGLE_ADS_CONFIG_JSON }}
          SJAWC_META_ACCESS_TOKEN: ${{ secrets.SJAWC_META_ACCESS_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          SJAWC_GHL_ACCESS_TOKEN: ${{ secrets.SJAWC_GHL_ACCESS_TOKEN }}
          GHL_ACCESS_TOKEN: ${{ secrets.GHL_ACCESS_TOKEN }}
          SEARCH_ATLAS_API_KEY: ${{ secrets.SEARCH_ATLAS_API_KEY }}
        run: python tools/refresh_sjawc_data.py

      - name: Build SJAWC report
        run: python tools/build_sjawc_meeting_report.py

      - name: Commit refreshed SJAWC report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/sjawc/ga4.json \
            data/sjawc/ga4_key_events.json \
            data/sjawc/ga4_organic_content.json \
            data/sjawc/ghl.json \
            data/sjawc/google_ads.json \
            data/sjawc/meta.json \
            data/sjawc/refresh_summary.json \
            data/sjawc/search_atlas_gbp_comparison.json \
            data/sjawc/search_atlas.json \
            data/sjawc/workbook.json \
            firebase-static/public/st-johns-aesthetics/index.html
          if git diff --cached --quiet; then
            echo "No SJAWC report changes to commit."
          else
            git commit -m "Refresh SJAWC cached report data"
            git push
          fi
