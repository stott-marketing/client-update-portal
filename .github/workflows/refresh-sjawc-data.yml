name: Refresh SJAWC Data (Last30 vs Prev30 + dropdown windows)

on:
  workflow_dispatch:
  schedule:
        - cron: "0 9 * * *" # 5am ET daily

permissions:
  contents: write

concurrency:
  group: refresh-sjawc-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
            - run: python -m pip install openpyxl google-auth google-auth-oauthlib google-api-python-client requests
            - name: Prepare Google creds
        env:
          SJAWC_GOOGLE_TOKEN_JSON: ${{ secrets.SJAWC_GOOGLE_TOKEN_JSON }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          SJAWC_META_TOKEN: ${{ secrets.SJAWC_META_TOKEN }}
          SJAWC_SEARCH_ATLAS_KEY: ${{ secrets.SEARCH_ATLAS_API_KEY }}
          SJAWC_GHL_TOKEN: ${{ secrets.SJAWC_GHL_TOKEN }}
        run: |
          mkdir -p ~/.config/stott-marketing/google-data/tokens
          mkdir -p ~/.config/stott-marketing/meta-data/tokens
          mkdir -p ~/.config/stott-marketing/search-atlas/tokens
          mkdir -p ~/.config/stott-marketing/ghl-data/tokens
          mkdir -p /tmp
          echo "$SJAWC_GOOGLE_TOKEN_JSON" > ~/.config/stott-marketing/google-data/tokens/sjawc-michaelrstott.json
          echo "$SJAWC_GOOGLE_TOKEN_JSON" > /tmp/google_token.json
          echo "$GOOGLE_OAUTH_CLIENT_JSON" > /tmp/google_oauth_client.json
          echo "$SJAWC_META_TOKEN" > ~/.config/stott-marketing/meta-data/tokens/michaelrstott.txt || true
          echo "$SJAWC_SEARCH_ATLAS_KEY" > ~/.config/stott-marketing/search-atlas/tokens/search-atlas-key.txt || true
          echo "$SJAWC_GHL_TOKEN" > ~/.config/stott-marketing/ghl-data/tokens/sjawc.txt || true
            - name: Refresh SJAWC
        env:
          SJAWC_GOOGLE_TOKEN_JSON: ${{ secrets.SJAWC_GOOGLE_TOKEN_JSON }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: python tools/refresh_sjawc_data.py
            - name: Rebuild SJAWC static pages
        run: |
          python tools/build_sjawc_meeting_report.py || true
          python tools/build_sjawc_static.py || true
            - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/sjawc/ firebase-static/public/st-johns-aesthetics/ || true
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Refresh SJAWC live.json last30 vs prev30 + rebuild report"; git push; fi
